<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio</title>
  <link rel="stylesheet" href="cardapio.css">
</head>
<body>
  <div id="imag"> </div>
  <h1>Cardápio</h1>
  <h2>Hamburguers</h2>
  <form action="pedidor.js" method="get">
    <h3>Escolha um hambúrguer:</h3>
    <fieldset class="burg">
      <input type="checkbox" name="x-Bacon" id="X-Bacon">
      <label for="X-Bacon">X-Bacon</label>
      <br>
      <input type="checkbox" name="x-calabresa" id="X-Calabresa">
      <label for="X-Calabresa">X-Calabresa</label>
      <br>
      <input type="checkbox" name="x-eggs" id="X-Eggs">
      <label for="X-Eggs">X-Eggs</label>
      <br>
      <input type="checkbox" name="x-salada" id="X-salada">
      <label for="X-Salada">X-Salada</label>
      
    </fieldset>
    <br>

    <h2>Bebidas</h2>
    <h3>Escolha um Refri:</h3>
    <fieldset class="bebidas">
      <input type="checkbox" name="coca" id="cola"></input>
      <label for="coca">Coca-Cola</label>
      <br>
      <input type="checkbox" name="pepsi" id="pepsi"></input>
      <label for="pepsi">Pepsi</label>
      <br>
      <input type="checkbox" name="fanta" id="fanta"></input>
      <label for="fanta">Fanta</label>
      <br>
      <input type="checkbox" name="guaraná" id="guaraná"></input>
      <label for="guaraná">Guaraná</label>
    </fieldset>
    <br>

    <h2>Acompanhamentos</h2>
    <h3>Escolha um Acompanhamento:</h3>
    <fieldset class="fritas">
      <input type="checkbox" name="batata-frita" id="batata-frita"></input>
      <label for="batata-frita">Batata Frita</label>
      <br>
      <input type="checkbox" name="batata-rustica" id="batata-rustica"></input>
      <label for="batata-rustica">Batata Rústica</label>
      <br>
      <input type="checkbox" name="onion-rings" id="onion-rings"></input>
      <label for="onion-rings">Onion Rings</label>
      <br>
      <input type="checkbox" name="nuggets" id="nuggets"></input>
      <label for="nuggets">Nuggets</label>
    </fieldset>
    <br>
    <h2>Bebidas</h2>
    <h3>Escolha um Café:</h3>
    <fieldset class="cafe">
      <input type="checkbox" name="cafe" id="cafe"></input>
      <label for="cafe">Café puro</label> 
      <br>
      <input type="checkbox" name="espresso" id="espresso"></input>
      <label for="espresso">Espresso</label>
      <br>
      <input type="checkbox" name="cafLeite" id="cafLeite"></input>
      <label for="cafLeite">Café com Leite</label>
      <br>
      <input type="checkbox" name="cafe-e-guaraná" id="cafe-e-guaraná"></input>
      <label for="cafe-e-guaraná">Café com Guaraná</label>
    </fieldset>

    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <input type="submit" value="Preparar Pedido" id="enviar">
  </form>

  
</body>
</html>
